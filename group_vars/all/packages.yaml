---
debian_apt_mirror: https://deb.debian.org/debian
debian_apt_security_mirror: https://deb.debian.org/debian-security
debian_apt_components:
  - main
  - contrib
debian_apt_backports_enabled: false

# Install Brendan Gregg's PMC tools
pmc_cloud_tools_enabled: false
pmc_cloud_tools_repo: https://git.itqdev.xyz/Infrastructure/pmc-cloud-tools.git

system_packages:
  essential:
    - curl
    - wget
    - git
    - vim
    - gnupg
    - ca-certificates
    - openssl
    - apt-transport-https
    - iproute2
    - net-tools
    - unzip
    - tree
    - bash-completion
    - tmux
    - rsync
    - lm-sensors
    - strace
    - ltrace
    - lsscsi
    - lshw
    - jq
    - yq
    - socat
    - netcat-traditional
    - vmtouch
    - gdb
    - gcc
    - cron
    - bat
    - sqlite3
    - python3-docker
    - acpi
    - attr
  monitoring:
    - htop
    - atop
    - psmisc  # pstree
    - iotop
    - nethogs
    - nload
    - sysstat
    - dstat
    - smartmontools
    - tcpdump
    - conntrack
    - bpftool
    - bpftrace
    - bpfcc-tools
    - nmap
    - iftop
    - iperf3
    - linux-perf
    - fio
    - traceroute
    - mtr
    - ngrep
    - tcpflow
    - pwru
  security:
    - auditd
    - fail2ban
    - nftables
